<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ashvi, Flavours of Elegance</title>
  <link rel="stylesheet" href="styles.css?v=27" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/fill/style.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%234F3E35'/%3E%3Ctext x='16' y='22' font-family='Playfair Display' font-size='18' fill='%23EAE0D5' text-anchor='middle'%3EA%3C/text%3E%3C/svg%3E" />
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script src="data.js?v=15"></script>
  <script type="text/babel" src="tweaks-panel.jsx?v=14"></script>
  <script type="text/babel" src="components.jsx?v=22"></script>
  <script type="text/babel" src="pages.jsx?v=24"></script>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
      "showTicker": true,
      "showBanners": true,
      "showQuote": true,
      "showReviews": true,
      "accentTone": "warm"
    }/*EDITMODE-END*/;

    const API_BASE = window.API_BASE = window.location.hostname === 'localhost'
      ? 'http://localhost:3002/v1'
      : 'https://api-production-377b.up.railway.app/v1';

    window.getProductFestivalSlug = function getProductFestivalSlug(p) {
      const text = [p.slug, p.id, p.name, p.tagline, p.description].filter(Boolean).join(' ').toLowerCase();
      if (text.includes('diwali') || text.includes('diya')) return 'diwali';
      if (text.includes('holi')) return 'holi';
      if (text.includes('christmas') || text.includes('cinnamon')) return 'christmas';
      if (text.includes('valentine') || text.includes('heart')) return 'valentine';
      return '';
    }

    window.normalizeCategory = function normalizeCategory(c, parent) {
      const id = c.slug || c.id;
      return {
        id,
        backendId: c.id,
        name: c.name,
        tag: c.tag || '',
        blurb: c.blurb || c.description || '',
        long: c.long || c.description || c.blurb || '',
        image: c.image || c.image_url || '',
        parentId: parent ? parent.id : (c.parentId || c.parent_id || null),
        subcategories: (c.subcategories || []).map(sub => window.normalizeCategory(sub, { id }))
      };
    }

    window.normalizeProduct = function normalizeProduct(p) {
      const allImages = p.images || [];
      const mainImgObj = allImages.find(i => i.isMain || i.is_main) || allImages[0];
      const mainImg = p.imgSrc || (mainImgObj && mainImgObj.url) || '';
      const categorySlug = p.categorySlug || (p.category && p.category.slug) || p.category || '';
      const gallery = allImages
        .filter(i => !(i.isMain || i.is_main) && i.url && i.url !== mainImg)
        .map(i => i.url);
      return {
        id: p.slug || p.id,
        name: p.name,
        tagline: p.tagline,
        description: p.description || '',
        price: parseFloat(p.price),
        mrp: p.mrp ? parseFloat(p.mrp) : undefined,
        badge: p.badge || undefined,
        image: mainImg,
        gallery: gallery.length ? gallery : undefined,
        imgBg: p.imgBg || '#fdf8f2',
        size: p.volume || '',
        burn: p.burn_time || '',
        vessel: p.vessel || '',
        notes: p.notes || undefined,
        ingredients: p.ingredients
          ? p.ingredients.map(i => ({ name: i.name, desc: i.description || i.desc || '' }))
          : undefined,
        category: categorySlug,
        categoryName: p.categoryName || (p.category && p.category.name) || '',
        festival: p.festival || (['diwali', 'holi', 'christmas', 'valentine'].includes(categorySlug) ? categorySlug : (categorySlug === 'festive' ? window.getProductFestivalSlug(p) : '')),
        in_stock: p.in_stock !== false,
      };
    }

    window.getCategoryProducts = function getCategoryProducts(category, products) {
      const childIds = (category.subcategories || []).map((sub) => sub.id);
      return products.filter((p) => {
        if (category.parentId) return p.category === category.id || (p.category === category.parentId && p.festival === category.id);
        if (childIds.length) return p.category === category.id || childIds.includes(p.category) || childIds.includes(p.festival);
        return p.category === category.id;
      });
    }

    window.withCategoryProductImages = function withCategoryProductImages(categories, products) {
      return categories.map((category) => {
        const firstProductImage = window.getCategoryProducts(category, products).find((p) => p.image)?.image;
        return {
          ...category,
          image: firstProductImage || category.image,
          subcategories: window.withCategoryProductImages(category.subcategories || [], products)
        };
      });
    }

    window.mergeCategoryFallbacks = function mergeCategoryFallbacks(categories, fallbackCategories) {
      return categories.map((category) => {
        const fallback = fallbackCategories.find((c) => c.id === category.id);
        const fallbackSubs = fallback ? (fallback.subcategories || []) : [];
        const subcategories = (category.subcategories || []).length
          ? window.mergeCategoryFallbacks(category.subcategories, fallbackSubs)
          : fallbackSubs;

        return {
          ...category,
          tag: category.tag || fallback?.tag || '',
          blurb: category.blurb || fallback?.blurb || '',
          long: category.long || fallback?.long || '',
          image: category.image || fallback?.image || '',
          subcategories
        };
      });
    }

    function App() {
      const { TICKER_ITEMS: STATIC_TICKER, REVIEWS: STATIC_REVIEWS } = window.ASHVI_DATA;
      const staticCategories = window.ASHVI_DATA.CATEGORIES;
      const [PRODUCTS, setProducts] = useState(window.ASHVI_DATA.PRODUCTS.map(window.normalizeProduct));
      const [CATEGORIES, setCategories] = useState(staticCategories);
      const [REVIEWS, setReviews] = useState(STATIC_REVIEWS);
      const [TICKER_ITEMS, setTickerItems] = useState(STATIC_TICKER);
      const [loading, setLoading] = useState(true);
      const [route, setRoute] = useState({ page: 'home' });
      const [cart, setCart] = useState([]);
      const [cartOpen, setCartOpen] = useState(false);
      const [searchOpen, setSearchOpen] = useState(false);
      const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);

      useEffect(() => {
        Promise.all([
          fetch(API_BASE + '/products?limit=100').then(r => r.json()).catch(() => ({})),
          fetch(API_BASE + '/categories').then(r => r.json()).catch(() => ({})),
          fetch(API_BASE + '/cms/testimonials').then(r => r.json()).catch(() => ({})),
          fetch(API_BASE + '/cms/ticker').then(r => r.json()).catch(() => ({})),
        ]).then(([prodData, catData, testimonialData, tickerData]) => {
          if (prodData.success && prodData.products.length > 0) {
            setProducts(prodData.products.map(window.normalizeProduct));
          }
          if (catData.success && catData.categories.length > 0) {
            setCategories(window.mergeCategoryFallbacks(
              catData.categories.map(c => window.normalizeCategory(c)),
              staticCategories
            ));
          }
          if (tickerData.success && tickerData.messages.length > 0) {
            setTickerItems(tickerData.messages.map(m => m.message));
          }
          if (testimonialData.success && testimonialData.testimonials.length > 0) {
            setReviews(testimonialData.testimonials.map(r => ({
              text: r.body,
              name: r.reviewer_name,
              loc: r.reviewer_loc || '',
              initial: r.reviewer_name ? r.reviewer_name[0].toUpperCase() : '?',
              rating: r.rating,
            })));
          }
        }).finally(() => setLoading(false));
      }, []);

      const navigate = (next) => {
        setRoute(next);
        window.scrollTo({ top: 0, behavior: 'instant' });
      };

      const addToCart = (id, qty = 1, options = {}) => {
        setCart(c => {
          const existing = c.find(x => x.id === id);
          if (existing) return c.map(x => x.id === id ? { ...x, qty: x.qty + qty } : x);
          return [...c, { id, qty }];
        });
        if (options.openDrawer !== false) setCartOpen(true);
      };
      const updateQty = (id, qty) => {
        if (qty <= 0) return setCart(c => c.filter(x => x.id !== id));
        setCart(c => c.map(x => x.id === id ? { ...x, qty } : x));
      };
      const removeItem = (id) => setCart(c => c.filter(x => x.id !== id));
      const cartCount = cart.reduce((s, c) => s + c.qty, 0);
      const DISPLAY_CATEGORIES = useMemo(
        () => window.withCategoryProductImages(CATEGORIES, PRODUCTS),
        [CATEGORIES, PRODUCTS]
      );

      // Apply accent tone tweak
      useEffect(() => {
        const root = document.documentElement;
        const tones = {
          warm: { sandstone: '#EAE0D5', cream: '#F9F6F0', gold: '#C1A68D' },
          cool: { sandstone: '#E1DDD3', cream: '#F4F2EC', gold: '#A89B89' },
          deep: { sandstone: '#D9CDB9', cream: '#EFE9DD', gold: '#A88766' }
        };
        const t = tones[tweaks.accentTone] || tones.warm;
        root.style.setProperty('--sandstone', t.sandstone);
        root.style.setProperty('--cream', t.cream);
        root.style.setProperty('--gold', t.gold);
      }, [tweaks.accentTone]);

      let pageEl;
      if (route.page === 'home') {
        pageEl = <HomePage navigate={navigate} addToCart={addToCart} products={PRODUCTS} categories={DISPLAY_CATEGORIES} reviews={REVIEWS} />;
      } else if (route.page === 'category') {
        pageEl = <CategoryPage categoryId={route.categoryId} navigate={navigate} addToCart={addToCart} products={PRODUCTS} categories={DISPLAY_CATEGORIES} />;
      } else if (route.page === 'product') {
        pageEl = <ProductPage productId={route.productId} navigate={navigate} addToCart={addToCart} products={PRODUCTS} />;
      } else if (route.page === 'about') {
        pageEl = <AboutPage navigate={navigate} />;
      } else if (route.page === 'checkout' || route.page === 'cart') {
        pageEl = <CartPage
          navigate={navigate}
          cart={cart}
          products={PRODUCTS}
          updateQty={updateQty}
          removeItem={removeItem}
          addToCart={addToCart}
        />;
      } else if (route.page === 'privacy') {
        pageEl = <PrivacyPage navigate={navigate} />;
      }

      const screenLabel = {
        home: '01 Home', category: '02 Category', product: '03 Product Detail', about: '04 About', checkout: '05 Checkout', cart: '05 Checkout', privacy: '06 Privacy'
      }[route.page];

      return (
        <div data-screen-label={screenLabel}>
          {tweaks.showTicker && <Ticker items={TICKER_ITEMS} />}
          <Navbar
            currentPage={route.page}
            currentCategoryId={route.categoryId}
            navigate={navigate}
            cartCount={cartCount}
            openCart={() => setCartOpen(true)}
            openSearch={() => setSearchOpen(true)}
            categories={DISPLAY_CATEGORIES}
          />
          {pageEl}
          <Footer navigate={navigate} />
          {ReactDOM.createPortal(
            <button className="floating-cart" onClick={() => navigate({ page: 'checkout' })} aria-label="Cart">
              <Icon name="bag" size={20} />
              {cartCount > 0 && <span className="floating-cart-count">{cartCount}</span>}
            </button>,
            document.body
          )}
          <CartDrawer open={cartOpen} onClose={() => setCartOpen(false)} cart={cart} products={PRODUCTS} updateQty={updateQty} removeItem={removeItem} navigate={navigate} />
          <SearchOverlay open={searchOpen} onClose={() => setSearchOpen(false)} products={PRODUCTS} navigate={navigate} />

          <TweaksPanel title="Tweaks">
            <TweakSection title="Sections">
              <TweakToggle label="Show top ticker" value={tweaks.showTicker} onChange={(v) => setTweak('showTicker', v)} />
              <TweakToggle label="Show promo banners" value={tweaks.showBanners} onChange={(v) => setTweak('showBanners', v)} />
              <TweakToggle label="Show trust quote" value={tweaks.showQuote} onChange={(v) => setTweak('showQuote', v)} />
              <TweakToggle label="Show customer reviews" value={tweaks.showReviews} onChange={(v) => setTweak('showReviews', v)} />
            </TweakSection>
            <TweakSection title="Palette">
              <TweakRadio
                label="Tone"
                value={tweaks.accentTone}
                onChange={(v) => setTweak('accentTone', v)}
                options={[
                  { value: 'warm', label: 'Warm' },
                  { value: 'cool', label: 'Cool' },
                  { value: 'deep', label: 'Deep' }
                ]}
              />
            </TweakSection>
            <TweakSection title="Quick navigate">
              <TweakButton label="Home" onClick={() => navigate({ page: 'home' })} />
              <TweakButton label="Signature category" onClick={() => navigate({ page: 'category', categoryId: 'signature' })} />
              <TweakButton label="Sample product" onClick={() => navigate({ page: 'product', productId: 'rose-bouquet' })} />
              <TweakButton label="About" onClick={() => navigate({ page: 'about' })} />
            </TweakSection>
          </TweaksPanel>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
